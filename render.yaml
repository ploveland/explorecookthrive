# Explore Cook Thrive on Render.
# Persistent disk is required: kitchens, the library, and ratings live in .data/.
# Paid instance types only (disks are not available on free web services).

services:
  - type: web
    name: explore-cook-thrive
    runtime: node
    plan: starter
    region: oregon
    # NODE_ENV=production would skip Tailwind/TypeScript if they stayed in
    # devDependencies. Keep --include=dev so `next build` still has them if
    # a package drifts back into that section.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CONVERT_STAGE_DELAY_MS
        value: "350"
      # 0 = unlimited. Raise these later to restore guest/daily caps.
      - key: CONVERT_GUEST_LIMIT
        value: "0"
      - key: CONVERT_AUTH_DAILY_LIMIT
        value: "0"
      - key: AUTH_SECRET
        generateValue: true
        sync: false
      # Secrets stay on the service. Do not set empty values here — Blueprint
      # sync would wipe keys pasted in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
    disk:
      name: ect-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
