# Explore Cook Thrive on Render.
# Persistent disk is required: kitchens, the library, and ratings live in .data/.
# Paid instance types only (disks are not available on free web services).

services:
  - type: web
    name: explore-cook-thrive
    runtime: node
    plan: starter
    region: oregon
    # NODE_ENV=production would skip Tailwind/TypeScript if they stayed in
    # devDependencies. Keep --include=dev so `next build` still has them if
    # a package drifts back into that section.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CONVERT_STAGE_DELAY_MS
        value: "350"
      - key: AUTH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: USDA_FDC_API_KEY
        value: ""
    disk:
      name: ect-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
